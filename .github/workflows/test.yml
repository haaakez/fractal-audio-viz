name: test

on:
  push:
  pull_request:

jobs:
  python-and-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev pkg-config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Build and test
        run: make test
      - name: Compile helper tools
        run: python -m py_compile visualizer.py profiles.py gui.py make_preview.py point_sheet.py examples/make_test_tone.py
